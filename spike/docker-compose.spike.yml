# Isolated spike stack — simplead-backup architecture validation.
# Fully separate from the Coolify/production containers: distinct project name
# (docker compose -p sam_spike), own network, own volumes, private host ports.
# NOTHING here touches production, real credentials, or client sites.
name: sam_spike

networks:
  sam_spike_net:
    driver: bridge

volumes:
  spike_db_data:
  spike_minio_data:
  spike_wp_data:
  spike_wp_tmp:        # WP /tmp on a named volume so resume-after-restart is measurable

services:
  spike-minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: spikeadmin
      MINIO_ROOT_PASSWORD: spikeadmin123
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - spike_minio_data:/data
    networks: [sam_spike_net]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  spike-minio-mc:
    image: minio/mc:latest
    depends_on:
      spike-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set spike http://spike-minio:9000 spikeadmin spikeadmin123 &&
      mc mb -p spike/backups &&
      mc mb -p spike/backups-restore &&
      echo 'buckets ready' &&
      exit 0"
    networks: [sam_spike_net]

  # Persistent mc helper: shares a host scratch dir with the orchestrator so pulled
  # chunks can be streamed to MinIO (mc auto-multiparts objects > ~64MB).
  spike-mc:
    image: minio/mc:latest
    depends_on:
      spike-minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "mc alias set spike http://spike-minio:9000 spikeadmin spikeadmin123 >/dev/null 2>&1; sleep infinity"]
    volumes:
      - ./scratch:/scratch
    networks: [sam_spike_net]

  spike-db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --max_allowed_packet=256M
    environment:
      MYSQL_ROOT_PASSWORD: spikeroot
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp
      MYSQL_PASSWORD: wp
      TZ: UTC
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - spike_db_data:/var/lib/mysql
    networks: [sam_spike_net]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pspikeroot"]
      interval: 5s
      timeout: 3s
      retries: 30

  spike-wp:
    image: wordpress:6-php8.3-apache
    depends_on:
      spike-db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: spike-db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "0"
      TZ: UTC
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - spike_wp_data:/var/www/html
      - spike_wp_tmp:/tmp
      - ../wordpress-plugin/simplead-manager-connector:/var/www/html/wp-content/plugins/simplead-manager-connector:ro
      - ./config/php-spike.ini:/usr/local/etc/php/conf.d/zz-spike.ini:ro
    # Deliberately shared-hosting-like limits so chunking/resume actually engage.
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 2g
    networks: [sam_spike_net]
