# ============================================================================
# manager.simplead.ro — stack aplicativ pentru Coolify (proiect simplead-manager)
#
# NU conține: PostgreSQL, Redis (resurse managed Coolify), certbot, sandbox WP,
# publicări de porturi pe host. Traefik (Coolify) termină TLS și rutează spre
# serviciul `manager-nginx`.
#
# Serviciile folosesc nume UNICE cu prefix `manager-` pentru a nu coliziona pe
# rețeaua shared `coolify` cu simplead-app / simplead-hub / simplead-web.
#
# horizon + scheduler sunt protejate de gate-ul MANAGER_WORKERS_ENABLED. În
# producție e `true` (workerii lucrează). Default-ul e `false` — un mediu nou
# pornește inert (loop de sleep: zero joburi, zero schedule ticks), ca să nu
# apeleze site-uri client din greșeală. NU schimba default-ul.
#
# Acesta e SINGURUL stack de deploy. `docker-compose.prod.yml` + `deploy.sh`
# (stack-ul self-hosted pre-Coolify, cu Postgres/Redis/certbot pe host) au fost
# șterse pe 2026-07-31 — vezi CLAUDE.md. Sandbox-ul de restore trăiește separat,
# opt-in, în `docker-compose.sandbox.yml`.
# ============================================================================

x-app-image: &app-image
  image: ${APP_IMAGE:-simplead-manager-app:latest}
  build:
    context: .
    dockerfile: docker/php/Dockerfile.prod
    target: app

x-app-env: &app-env
  APP_NAME: ${APP_NAME:-}
  APP_ENV: ${APP_ENV:-}
  APP_KEY: ${APP_KEY:-}
  APP_DEBUG: ${APP_DEBUG:-}
  APP_TIMEZONE: ${APP_TIMEZONE:-}
  APP_URL: ${APP_URL:-}
  APP_LOCALE: ${APP_LOCALE:-}
  APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-}
  APP_MAINTENANCE_DRIVER: ${APP_MAINTENANCE_DRIVER:-}
  BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-}
  LOG_CHANNEL: ${LOG_CHANNEL:-}
  LOG_DEPRECATIONS_CHANNEL: ${LOG_DEPRECATIONS_CHANNEL:-}
  LOG_LEVEL: ${LOG_LEVEL:-}
  LOG_DAILY_DAYS: ${LOG_DAILY_DAYS:-}
  # --- PostgreSQL: app prin PgBouncer, migrări prin conexiune directă ---------
  DB_CONNECTION: pgsql
  DB_HOST: ${DB_HOST:-manager-pgbouncer}
  DB_PORT: ${DB_PORT:-5432}
  DB_DATABASE: ${DB_DATABASE:-}
  DB_USERNAME: ${DB_USERNAME:-}
  DB_PASSWORD: ${DB_PASSWORD:-}
  DB_DIRECT_HOST: ${DB_DIRECT_HOST:-}
  DB_DIRECT_PORT: ${DB_DIRECT_PORT:-5432}
  DB_SSLMODE: ${DB_SSLMODE:-prefer}
  # --- Redis: resursă managed Coolify ----------------------------------------
  REDIS_CLIENT: ${REDIS_CLIENT:-phpredis}
  REDIS_HOST: ${REDIS_HOST:-}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  SESSION_DRIVER: ${SESSION_DRIVER:-}
  SESSION_LIFETIME: ${SESSION_LIFETIME:-}
  SESSION_ENCRYPT: ${SESSION_ENCRYPT:-}
  SESSION_PATH: ${SESSION_PATH:-}
  SESSION_DOMAIN: ${SESSION_DOMAIN:-}
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-}
  BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-}
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:-}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-}
  CACHE_STORE: ${CACHE_STORE:-}
  CACHE_DRIVER: ${CACHE_DRIVER:-}
  CACHE_LOCKS_DRIVER: ${CACHE_LOCKS_DRIVER:-}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  # --- Gotenberg: sidecar intern ---------------------------------------------
  GOTENBERG_URL: ${GOTENBERG_URL:-http://manager-gotenberg:3000}
  # --- Mail: default `log` — un mediu nou nu trimite email real până e setat --
  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_SCHEME: ${MAIL_SCHEME:-}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_PORT: ${MAIL_PORT:-}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
  # --- Chei ireversibile: copiate IDENTIC de pe sursă (runtime only) ----------
  BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
  PAGESPEED_API_KEY: ${PAGESPEED_API_KEY:-}
  HORIZON_PREFIX: ${HORIZON_PREFIX:-}
  HORIZON_BACKUP_WORKERS: ${HORIZON_BACKUP_WORKERS:-}
  SCHEDULER_HEARTBEAT_URL: ${SCHEDULER_HEARTBEAT_URL:-}
  VITE_APP_NAME: ${VITE_APP_NAME:-}

services:

  # ==========================================================================
  # manager-app — PHP-FPM (port 9000 intern). NU rulează migrări la start
  # (schema vine din restore-ul DB). read_only + tmpfs + no-new-privileges.
  # ==========================================================================
  manager-app:
    <<: *app-image
    container_name: manager-app
    entrypoint: ["/var/www/html/docker/php/entrypoint.sh"]
    command: ["php-fpm"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "1.5"
        reservations:
          memory: 512M
    environment:
      <<: *app-env
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      manager-pgbouncer:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777
      - /var/run:size=8M
      - /var/www/html/bootstrap/cache:size=16M,uid=1000,gid=1000
    stop_grace_period: 30s

  # ==========================================================================
  # manager-nginx — singurul serviciu expus către Traefik. Fără TLS, fără
  # certbot (Traefik termină TLS). Selectează template-ul HTTP la start.
  # ==========================================================================
  manager-nginx:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
      target: nginx
    image: ${NGINX_IMAGE:-simplead-manager-nginx:latest}
    container_name: manager-nginx
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.3"
        reservations:
          memory: 64M
    command: >
      sh -c '
      rm -f /etc/nginx/conf.d/default.conf;
      cp /etc/nginx/templates/http.conf /etc/nginx/conf.d/app.conf;
      echo "Coolify/Traefik terminates TLS - nginx serving HTTP on :80";
      exec nginx -g "daemon off;"
      '
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - app-storage:/var/www/html/storage:ro
    depends_on:
      manager-app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

  # ==========================================================================
  # manager-horizon — procesează cozile. ACTIV în producție.
  #
  # Gate: MANAGER_WORKERS_ENABLED. `false` (default) → loop de sleep, ZERO joburi
  # procesate — nu apelează site-uri client, nu trimite email/Slack, nu face
  # backup/restore. Asta protejează un mediu nou; producția îl are pe `true`.
  #
  # stop_grace_period 3660s: un RestoreBackup poate rula până la 3600s; un grace
  # mai scurt ar tăia un restore în doi. Cifra e potrivită cu Horizon: la oprire,
  # MasterSupervisor::terminate() așteaptă `longestActiveTimeout()`, adică cei
  # 3600s ai lui supervisor-backups, plus un minut de marjă.
  #
  # stop_signal SIGTERM: imaginea de bază e php:8.3-fpm-alpine, care declară
  # `STOPSIGNAL SIGQUIT` — corect pentru php-fpm, care așa se oprește frumos, și
  # de aceea manager-app îl păstrează. Pentru Horizon e greșit: masterul ascultă
  # SIGTERM/SIGUSR1/SIGUSR2/SIGCONT (ListensForSignals) și SIGINT, dar NU SIGQUIT,
  # iar semnalul ajunge doar la PID 1, adică exact la master. Sub SIGQUIT nu exista
  # niciun handler, procesul murea pe loc, iar cele 3660 de secunde nu se foloseau
  # niciodată: Docker nu are ce aștepta de la un proces deja mort.
  #
  # Așa au înghețat sesiunile #136 și #140 la deploy — nu pentru că grace period-ul
  # era prea scurt, ci pentru că era irelevant. Joburile rămâneau în setul `reserved`
  # din Redis până expira retry_after (7200s), iar sesiunea arăta ca una încă în lucru.
  # (Worker-ii, ei, tratează SIGQUIT — Illuminate\Queue\Worker îl are în listă — dar
  # ei sunt copii, iar Docker nu semnalează copiii.)
  # ==========================================================================
  manager-horizon:
    <<: *app-image
    container_name: manager-horizon
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "1.8"
        reservations:
          memory: 1G
    environment:
      <<: *app-env
      MANAGER_WORKERS_ENABLED: ${MANAGER_WORKERS_ENABLED:-false}
      TMPDIR: /var/www/html/storage/app/temp
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ "$$MANAGER_WORKERS_ENABLED" != "true" ]; then
          echo "[horizon] DEZACTIVAT (MANAGER_WORKERS_ENABLED=$$MANAGER_WORKERS_ENABLED) - inert, niciun job procesat.";
          while true; do sleep 3600; done
        fi
        echo "[horizon] ACTIV";
        exec /var/www/html/docker/php/entrypoint.sh php artisan horizon
    healthcheck:
      test: ["CMD-SHELL", "[ \"$$MANAGER_WORKERS_ENABLED\" != \"true\" ] || php artisan horizon:status | grep -q running"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    stop_signal: SIGTERM
    stop_grace_period: 3660s
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      manager-pgbouncer:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=512M,mode=1777
      - /var/run:size=8M
      - /var/www/html/bootstrap/cache:size=16M,uid=1000,gid=1000

  # ==========================================================================
  # manager-scheduler — `schedule:work`. ACTIV în producție (același gate).
  #
  # stop_signal SIGTERM: același motiv ca la manager-horizon — imaginea de bază
  # declară SIGQUIT pentru php-fpm, iar o comandă artisan de lungă durată nu are
  # handler pentru el. Aici miza e mai mică (`schedule:work` doar declanșează), dar
  # sub SIGQUIT un `schedule:run` pornit chiar atunci era retezat, nu lăsat să
  # termine.
  # ==========================================================================
  manager-scheduler:
    <<: *app-image
    container_name: manager-scheduler
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.3"
        reservations:
          memory: 128M
    environment:
      <<: *app-env
      MANAGER_WORKERS_ENABLED: ${MANAGER_WORKERS_ENABLED:-false}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ "$$MANAGER_WORKERS_ENABLED" != "true" ]; then
          echo "[scheduler] DEZACTIVAT (MANAGER_WORKERS_ENABLED=$$MANAGER_WORKERS_ENABLED) - inert, niciun tick.";
          while true; do sleep 3600; done
        fi
        echo "[scheduler] ACTIV";
        exec /var/www/html/docker/php/entrypoint.sh php artisan schedule:work
    healthcheck:
      test: ["CMD-SHELL", "php -r 'echo 1;'"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    stop_signal: SIGTERM
    stop_grace_period: 30s
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      manager-app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777
      - /var/run:size=8M
      - /var/www/html/bootstrap/cache:size=16M,uid=1000,gid=1000

  # ==========================================================================
  # manager-pgbouncer — pooler intern. App-ul se conectează AICI; pgbouncer
  # se conectează la PostgreSQL managed (DB_DIRECT_HOST). Fără port public.
  # ==========================================================================
  manager-pgbouncer:
    image: edoburu/pgbouncer@sha256:85d1e38593617af1b5f7f285e97d407e56c29939683cc7cfe4c8f6dc19f1268b
    container_name: manager-pgbouncer
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.1"
        reservations:
          memory: 32M
    environment:
      DB_USER: "${DB_USERNAME:-}"
      DB_PASSWORD: "${DB_PASSWORD:-}"
      DB_HOST: "${DB_DIRECT_HOST:-}"
      DB_PORT: "${DB_DIRECT_PORT:-5432}"
      DB_NAME: "${DB_DATABASE:-}"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      RESERVE_POOL_TIMEOUT: 3
      SERVER_IDLE_TIMEOUT: 600
      SERVER_LIFETIME: 3600
      LOG_CONNECTIONS: 0
      LOG_DISCONNECTIONS: 0
      AUTH_TYPE: scram-sha-256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  # ==========================================================================
  # manager-gotenberg — sidecar PDF intern. Fără port public.
  # ==========================================================================
  manager-gotenberg:
    # Pinned to the version running in production (source drifted-free). The
    # floating :8 tag moved to a build that FATALs on telemetry log-level config.
    image: gotenberg/gotenberg:8.26.0
    container_name: manager-gotenberg
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 256M
    # Coolify injects ALL app env vars into every compose service, so gotenberg
    # inherits Laravel's LOG_LEVEL=warning — but gotenberg only accepts
    # error|warn|info|debug and FATALs on "warning". Unset it before launch so
    # only the explicit --log-level flag applies.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        unset LOG_LEVEL
        exec gotenberg --chromium-disable-javascript=true --api-timeout=120s --log-level=warn
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true

volumes:
  app-storage:
